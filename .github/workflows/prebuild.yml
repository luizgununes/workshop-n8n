# GitHub Codespaces Prebuilds
name: Prebuild Codespace

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  prebuild:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'luizgununes' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Pull Docker Images
      run: |
        docker pull n8nio/n8n:2.37.7
        docker pull evoapicloud/evolution-api:v2.3.7
        docker pull postgres:15
        docker pull redis:7-alpine
        docker pull mcr.microsoft.com/devcontainers/base:ubuntu-22.04
